name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:ui
      - run: npm run test:native
      - run: npm run prepare:engine
      - run: npm run build
      - run: npm run test:rust
      - run: npm run test:engine
      - run: npm run test:runtime
      - run: npm run package
      - name: Prepare installer and checksum
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer.' }
          New-Item -ItemType Directory -Force release | Out-Null
          $name = "Warp-Setup-$version.exe"
          Copy-Item -LiteralPath $installers[0].FullName -Destination (Join-Path release $name)
          $hash = (Get-FileHash -LiteralPath (Join-Path release $name) -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -LiteralPath (Join-Path release "$name.sha256") -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: Warp-Windows
          path: release/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Warp-test-evidence
          path: |
            .cache/runtime-*/report.json
            .cache/ui-*.png
            .cache/ui-results/**
          if-no-files-found: ignore
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Warp-Windows
          path: release
      - name: Publish Windows prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          test "$TAG" = "v$version"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --verify-tag --prerelease --title "Warp $TAG — Tauri + React" --notes-file "docs/releases/$TAG.md"
          fi
